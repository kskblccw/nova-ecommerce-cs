[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-cs"
version = "1.0.0"
description = "企业级电商智能客服系统（FastAPI + LangGraph）"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy[asyncio]==2.1.6",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "langgraph==1.2.19",
  "langgraph-checkpoint-postgres==3.2.0",
  "langchain==1.4.7",
  "langchain-core==1.7.3",
  "langchain-openai==1.7.3",
  "langsmith==0.14.16",
  "httpx==0.28.1",
  "PyJWT==2.15.1",
  "bcrypt==5.0.0",
  "python-dotenv==1.2.4",
  "structlog==26.1.0",
  "numpy==2.5.4",
  "pymilvus==2.6.9",
  "milvus-lite==3.2.2",
  "psycopg[binary,pool]==3.3.6",
  "redis==8.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "pytest-cov==7.0.0",
  "ruff==0.17.3",
  "mypy==2.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: 需要 PostgreSQL 的集成测试"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/ecommerce_cs/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
